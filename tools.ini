# qbittorrent web server
[server]
host=localhost
port=8080
username=admin
password=
connect_timeout=15.5
read_timeout=60.6

[server_temp_dirs]
/media/h250/t
/media/sams/t
/media/bestos/t
/media/t4/t

[server_save_dirs]
/media/h250/td
/media/sams/td
/media/bestos/td
/media/t4/td

[drive_map]
# server side = client side
/media/h250/ = o:\h250\
/media/sams/ = o:\sams\
/media/bestos/ = o:\bestos\
/media/t4/ = o:\t4\

[client_temp_dirs]
o:\h250\t
o:\sams\t
o:\bestos\t
o:\t4\t

[client_save_dirs]
o:\h250\td
o:\sams\td
o:\bestos\td
o:\t4\td

[client]

# all local dirs to scan if all requested
all_local_dirs = d:\_temp d:\_i d:\_del_dvs d:\_del_purge e:\_temp e:\_i e:\_del_dvs e:\_del_purge f:\_temp f:\_i f:\_del_dvs f:\_del_purge g:\_temp g:\_i g:\_del_dvs g:\_del_purge i:\_temp i:\_i i:\_del_dvs i:\_del_purge o:\bestos\td o:\t4\td o:\t4\_del_dvs o:\t4\_del_purge o:\sams\td o:\sams\_del_dvs o:\sams\_del_purge q:\storage l:\_temp l:\_i l:\_del_dvs l:\_del_purge

#h:\_del_dvs h:\_del_purge h:\_i
#o:\bestos\td o:\sams\td o:\h250\td 

[behaviour]
# amount of block hashes to deem files the copies
minimum_hash_confirms = 3

# in MiB
buffer_size=20

# min size of file to attempt repairs MiB too
min_file_size=10

# retry some things?
retry=3

# timeout for sleeping on torrents
timeout=60

# group limit to prevent wasting time on archives or vob files. search complexity is x^2
group_limit=100

# also this helps to make things faster, comment it if you want to specifically restore archives or dvd images
nono_regex=((\.rar)|(\.r\d\d)|(\.vob))(\.!qB)?$|( [dD]mg)

# 2 - pass matchmaking
hammer_matching=true

# hammering complexity
# slicing 2^depth in search of empty and non empty subslices
slicing_depth = 6
max_fragments = 100





